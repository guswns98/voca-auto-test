[pytest]
testpaths = tests
addopts =
    --alluredir=reports/allure-results
    --clean-alluredir
    -v
markers =
    p0: 핵심 기능 테스트 (서비스 불가 수준)
    p1: 주요 기능 테스트 (사용자 불편)
    p2: 부가 기능 테스트 (제한적 영향)
    auth: 온보딩/인증 테스트
    learn: 학습 기능 테스트
    quiz: 퀴즈 시스템 테스트
    cash: 보상 시스템 테스트
    habit: 습관 형성 테스트
    setting: 설정 테스트
    no_home_reset: 테스트 시작 전 홈 복귀 스킵
